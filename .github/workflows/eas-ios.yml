# Build iOS (IPA) via Expo EAS in the cloud.
#
# Setup (once):
# 1. expo.dev → Account → Access tokens → create token → GitHub repo → Settings → Secrets → EXPO_TOKEN
# 2. Locally: npx eas login && npx eas init  (adds extra.eas.projectId in app.json — commit that file)
# 3. Run at least one iOS build locally or configure credentials on expo.dev so CI can sign builds
#
name: EAS iOS build

on:
  workflow_dispatch:

concurrency:
  group: eas-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo auth
        run: eas whoami

      - name: EAS build (IPA, no Expo-managed Apple credentials)
        id: eas_ios
        run: eas build --platform ios --profile ipa --non-interactive --wait

      - name: If iOS build failed
        if: failure() && steps.eas_ios.outcome == 'failure'
        run: |
          echo "Profile ipa uses withoutCredentials. If it fails, build locally:"
          echo "  npm run build:ipa"
          echo "Then install with Sideloadly / AltStore using your Apple ID."
          echo "https://expo.dev/accounts/zfqqfqfqf/projects/tiktok/builds"

      - name: Download IPA (latest iOS build)
        id: download_ipa
        continue-on-error: true
        run: eas build:download --platform ios --non-interactive

      - name: Upload IPA as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            *.ipa
            **/*.ipa
          if-no-files-found: ignore

      - name: Expo builds (download IPA if artifact empty)
        if: success()
        run: |
          echo "Build dashboard (pick latest iOS → Download):"
          echo "https://expo.dev/accounts/zfqqfqfqf/projects/tiktok/builds"
