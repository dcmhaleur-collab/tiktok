# Unsigned device IPA for TrollStore / jailbreak (no Apple Developer account).
# Run manually: Actions → "iOS unsigned IPA (TrollStore)" → Run workflow
name: iOS unsigned IPA (TrollStore)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Resolve Xcode project and scheme
        id: xcode
        run: |
          cd ios
          PROJ="$(ls -1 *.xcodeproj 2>/dev/null | head -1)"
          WS=""
          for w in *.xcworkspace; do
            [ -f "$w/contents.xcworkspacedata" ] && WS="$w" && break
          done
          if [ -n "$WS" ]; then
            SCHEME="$(xcodebuild -list -workspace "$WS" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
            TARGET=workspace
            XCODE_PATH="$WS"
          elif [ -n "$PROJ" ]; then
            SCHEME="$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
            TARGET=project
            XCODE_PATH="$PROJ"
          fi
          if [ -z "$SCHEME" ]; then
            ls -la
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "path=$XCODE_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using $TARGET=$XCODE_PATH scheme=$SCHEME"

      - name: Archive (no code signing)
        run: |
          cd ios
          if [ "${{ steps.xcode.outputs.target }}" = "workspace" ]; then
            XCODE_TARGET=(-workspace "${{ steps.xcode.outputs.path }}")
          else
            XCODE_TARGET=(-project "${{ steps.xcode.outputs.path }}")
          fi
          xcodebuild \
            "${XCODE_TARGET[@]}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/tiktok.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP="$(find "$RUNNER_TEMP/tiktok.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "No .app found in archive"
            find "$RUNNER_TEMP/tiktok.xcarchive" -type d
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/tiktok-unsigned.ipa" Payload
          ls -la "$RUNNER_TEMP/tiktok-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-unsigned-ipa
          path: ${{ runner.temp }}/tiktok-unsigned.ipa
          if-no-files-found: error
