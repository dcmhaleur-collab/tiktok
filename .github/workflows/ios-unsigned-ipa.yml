# Unsigned device IPA for TrollStore / jailbreak (no Apple Developer account).
# Run manually: Actions → "iOS unsigned IPA (TrollStore)" → Run workflow
name: iOS unsigned IPA (TrollStore)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Archive (no code signing)
        run: |
          cd ios
          xcodebuild \
            -workspace tiktok.xcworkspace \
            -scheme tiktok \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/tiktok.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP="$(find "$RUNNER_TEMP/tiktok.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "No .app found in archive"
            find "$RUNNER_TEMP/tiktok.xcarchive" -type d
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/tiktok-unsigned.ipa" Payload
          ls -la "$RUNNER_TEMP/tiktok-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-unsigned-ipa
          path: ${{ runner.temp }}/tiktok-unsigned.ipa
          if-no-files-found: error
