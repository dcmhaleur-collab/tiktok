# Unsigned device IPA for TrollStore / jailbreak (no Apple Developer account).
# Run manually: Actions → "iOS unsigned IPA (TrollStore)" → Run workflow
name: iOS unsigned IPA (TrollStore)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Resolve Xcode project and scheme
        id: xcode
        run: |
          cd ios
          PROJ="$(ls -1 *.xcodeproj 2>/dev/null | head -1)"
          WS=""
          for w in *.xcworkspace; do
            [ -f "$w/contents.xcworkspacedata" ] && WS="$w" && break
          done
          if [ -n "$WS" ]; then
            SCHEME="$(xcodebuild -list -workspace "$WS" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
            TARGET=workspace
            XCODE_PATH="$WS"
          elif [ -n "$PROJ" ]; then
            SCHEME="$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
            TARGET=project
            XCODE_PATH="$PROJ"
          fi
          if [ -z "$SCHEME" ]; then
            ls -la
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "path=$XCODE_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using $TARGET=$XCODE_PATH scheme=$SCHEME"

      - name: Build for device (no code signing)
        id: ios_build
        run: |
          set -euo pipefail
          cd ios
          DERIVED="$RUNNER_TEMP/DerivedData"
          OUT="$RUNNER_TEMP/ios-out"
          mkdir -p "$OUT"
          if [ "${{ steps.xcode.outputs.target }}" = "workspace" ]; then
            XCODE_TARGET=(-workspace "${{ steps.xcode.outputs.path }}")
          else
            XCODE_TARGET=(-project "${{ steps.xcode.outputs.path }}")
          fi
          xcodebuild \
            "${XCODE_TARGET[@]}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            build \
            BUILD_DIR="$OUT" \
            SYMROOT="$OUT" \
            CONFIGURATION_BUILD_DIR="$OUT/Release-iphoneos" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO
          echo "derived=$DERIVED" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Package IPA
        run: |
          set -euo pipefail
          cd ios
          DERIVED="${{ steps.ios_build.outputs.derived }}"
          OUT="${{ steps.ios_build.outputs.out }}"
          if [ "${{ steps.xcode.outputs.target }}" = "workspace" ]; then
            XCODE_TARGET=(-workspace "${{ steps.xcode.outputs.path }}")
          else
            XCODE_TARGET=(-project "${{ steps.xcode.outputs.path }}")
          fi
          BUILT_PRODUCTS_DIR="$(xcodebuild "${XCODE_TARGET[@]}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            -showBuildSettings 2>/dev/null \
            | grep "BUILT_PRODUCTS_DIR" | tail -1 | sed 's/.*= *//')"
          WRAPPER_NAME="$(xcodebuild "${XCODE_TARGET[@]}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            -showBuildSettings 2>/dev/null \
            | grep "WRAPPER_NAME" | tail -1 | sed 's/.*= *//')"
          APP=""
          if [ -n "$BUILT_PRODUCTS_DIR" ] && [ -n "$WRAPPER_NAME" ] && [ -d "$BUILT_PRODUCTS_DIR/$WRAPPER_NAME" ]; then
            APP="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME"
          fi
          if [ -z "$APP" ]; then
            APP="$(find "$DERIVED" "$OUT" "$GITHUB_WORKSPACE/ios" -path '*Release-iphoneos/*.app' -type d 2>/dev/null | head -1)"
          fi
          if [ -z "$APP" ]; then
            APP="$(find "$DERIVED" "$OUT" "$GITHUB_WORKSPACE/ios" -name '*.app' -type d 2>/dev/null | head -1)"
          fi
          if [ -z "$APP" ]; then
            echo "No .app found. BUILT_PRODUCTS_DIR=$BUILT_PRODUCTS_DIR WRAPPER_NAME=$WRAPPER_NAME"
            find "$DERIVED" "$OUT" -maxdepth 6 -type d 2>/dev/null | head -60
            exit 1
          fi
          echo "Packaging: $APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$RUNNER_TEMP/tiktok-unsigned.ipa" Payload
          ls -la "$RUNNER_TEMP/tiktok-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-unsigned-ipa
          path: ${{ runner.temp }}/tiktok-unsigned.ipa
          if-no-files-found: error
